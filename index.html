<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 핵심 Top 5</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f5efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 핵심">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe3;--ink:#1c1b19;--sub:#6d665a;--rule:#cdc3ae;--soft:#ece4d2;--sage:#dfe8dc;--sageT:#4d6b52;--blue:#dfe7ee;--blueT:#46627a;
--serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;--sans:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1b1916;--ink:#ece6d9;--sub:#a39b8c;--rule:#403b33;--soft:#26231f;--sage:#27352a;--sageT:#a9c7ad;--blue:#222d37;--blueT:#a9c1d6}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:0 18px calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}button{font:inherit;color:inherit}
.mast{text-align:center;padding:16px 0 10px;border-bottom:3px double var(--ink);position:relative}
.date{font-size:12px;color:var(--sub);letter-spacing:.04em}
.title{font:900 30px/1.2 var(--serif);margin:4px 0 0;letter-spacing:.06em}
.mast button{position:absolute;right:0;top:14px;border:1px solid var(--rule);background:none;border-radius:2px;padding:2px 8px;font-size:12px;color:var(--sub)}
#install{left:0;right:auto}
.kick{font-size:12px;font-weight:700;color:var(--blueT);letter-spacing:.08em;margin:16px 0 4px}
.lead h2{font:900 24px/1.35 var(--serif);margin:0 0 6px}
.lead a,.ti h3 a,.rt a{text-decoration:none}
.sh{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin:26px 0 0;padding:6px 0}
.sh span:first-child{font:700 16px var(--serif)}.cnt{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
ol,ul{list-style:none;margin:0;padding:0}
.ti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.no{font:900 26px/1 var(--serif);color:var(--rule);min-width:26px;text-align:center;padding-top:2px}
.ti h3{font:700 17px/1.45 var(--serif);margin:0 0 3px}
.mt{font-size:12px;color:var(--sub)}
.sm{margin:6px 0 2px;font-size:14px;color:var(--ink);opacity:.85}
.why{font-size:11px;color:var(--sub);margin-top:4px}
.tag{font-size:11px;padding:0 6px;border-radius:2px;background:var(--sage);color:var(--sageT);margin-left:4px}
.tag.b{background:var(--blue);color:var(--blueT)}
details{margin-top:6px}summary{cursor:pointer;font-size:12px;color:var(--blueT)}
.rel{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--rule)}.rel li{padding:3px 0 3px 8px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips a{white-space:nowrap;font-size:13px;text-decoration:none;border:1px solid var(--rule);border-radius:2px;padding:3px 10px}
.lst li{padding:11px 0;border-bottom:1px solid var(--rule)}
.rt{font:500 15.5px/1.5 var(--serif)}
.more{width:100%;margin-top:8px;padding:8px;background:none;border:1px solid var(--rule);border-radius:2px;font-size:13px;color:var(--sub)}
.empty{font-size:13px;color:var(--sub);padding:12px 0}
.banner{border:1px solid var(--rule);background:var(--soft);padding:12px 14px;margin:18px 0}
.banner b{font:700 15px var(--serif)}.banner p{margin:4px 0 0;font-size:13px;color:var(--sub)}
.strip{margin-top:28px;padding:8px 0;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--sub)}
.strip i{font-style:normal;padding:0 5px;border:1px solid var(--rule);border-radius:2px;margin-right:3px}
.strip i.on{background:var(--sage);color:var(--sageT);border-color:var(--sage)}
.strip button{margin-left:auto;background:none;border:0;color:var(--blueT);padding:0;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 0;color:var(--sub);font-size:12px}
nav button.on{color:var(--ink);font-weight:700}nav svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);margin-top:18px}
.stat{padding:10px 4px;text-align:center;border-right:1px solid var(--rule)}.stat:last-child{border:0}
.stat b{display:block;font:900 20px var(--serif)}.stat span{font-size:11px;color:var(--sub)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;font:700 16px var(--serif)}
.mnav button{border:1px solid var(--rule);background:none;border-radius:2px;padding:2px 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.wd{text-align:center;font-size:11px;color:var(--sub)}
.cell{aspect-ratio:1/1.15;border:1px solid var(--rule);padding:3px;position:relative;display:flex;flex-direction:column;align-items:center}
.cell.empty{border:0}.cell.today{border:2px solid var(--ink)}
.dn{font-size:11px;color:var(--sub);align-self:flex-start}.paper{width:60%;max-width:30px}
.vc{position:absolute;bottom:2px;font-size:10px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--ink);background:none;border-radius:2px;padding:6px 12px;font-size:13px}.btn.pri{background:var(--ink);color:var(--bg)}
.sec p{font-size:13px;color:var(--sub);margin:6px 0}
</style>
</head>
<body>
<main>
  <header class="mast"><button id="install" hidden>설치</button><div class="date" id="date"></div><h1 class="title">오늘의 핵심</h1><button id="refresh" aria-label="새로고침">새로고침</button></header>
  <section id="viewNews">
    <div id="banner"></div><div id="lead"></div><div id="top"></div>
    <div id="catWrap"></div><div class="strip" id="strip"></div>
    <p class="note" id="ios" hidden>아이폰은 공유 버튼 → "홈 화면에 추가"로 설치하세요.</p>
  </section>
  <section id="viewLog" hidden>
    <div class="stats">
      <div class="stat"><b id="sMonth">0</b><span>이번 달 읽은 날</span></div>
      <div class="stat"><b id="sStreak">0</b><span>연속 읽기</span></div>
      <div class="stat"><b id="sRead">0</b><span>오늘 읽은 기사</span></div>
      <div class="stat"><b id="sToday">0</b><span>오늘 방문</span></div>
    </div>
    <div class="mnav"><button id="prev">‹</button><span id="mTitle"></span><button id="next">›</button></div>
    <div class="grid" id="cal"></div>
    <p class="note">신문 그림 = 기사를 읽은 날 · 숫자 = 방문 횟수 (이 기기에만 저장)</p>
    <div class="sh"><span>푸시 알림</span></div>
    <div class="sec"><p id="pushState"></p>
      <div class="row"><button class="btn pri" id="pushOn">푸시 켜기</button></div>
      <div class="row" id="pushCopy" hidden><button class="btn" id="cpSub">① PUSH_SUBSCRIPTION 복사</button><button class="btn" id="cpKey">② VAPID_PRIVATE_KEY 복사</button></div>
      <p>복사한 값은 GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret에 <b>이름 그대로</b> 저장하세요. 매일 아침 7:30에 푸시가 와요.</p></div>
  </section>
</main>
<nav>
  <button id="tabNews" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h11v16H7a2 2 0 0 1-2-2z"/><path d="M16 8h3v10a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h3"/></svg>오늘의 신문</button>
  <button id="tabLog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>기록</button>
</nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = u => /^https?:\/\//.test(u || "") ? u : "#";
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const CATS = ["정치","경제","사회","국제","과학·IT","문화·생활","주식"];
const label = c => c === "미분류" ? "기타" : c;
const when = iso => { const d = new Date(iso), t = d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth()+1}/${d.getDate()} ${t}`; };
$("#date").textContent = new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});

/* ---------- 읽음/방문 기록 (이 기기 localStorage) ---------- */
const key = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const getStats = () => { try { return JSON.parse(store.get("stats") || "{}"); } catch(e) { return {}; } };
function bump(fn){ const s = getStats(), k = key(new Date()); s[k] = s[k] || {v:0, r:0}; fn(s[k]); store.set("stats", JSON.stringify(s)); }
function markCat(c){ if(c){ bump(o => { (o.c = o.c || {})[c] = 1; }); renderStrip(); } }
document.addEventListener("click", e => {
  const l = e.target.closest("a.al");
  if(l){ bump(o => { o.r = 1; o.a = o.a || []; if(!o.a.includes(l.dataset.id)) o.a.push(l.dataset.id); if(l.dataset.cat){ (o.c = o.c || {})[l.dataset.cat] = 1; } }); renderStrip(); }
  const m = e.target.closest(".more");
  if(m){ const c = m.dataset.c; shown[c] = (shown[c] || 3) + 10; markCat(c); renderCats(); }
});
bump(o => { o.v++; });
let hiddenAt = Date.now();
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(Date.now() - hiddenAt > 30 * 60 * 1000) bump(o => { o.v++; });
  load();
});
function renderStrip(){
  const s = getStats()[key(new Date())] || {}, c = s.c || {};
  $("#strip").innerHTML = `<span>오늘 읽은 기사 <b>${(s.a || []).length}</b>건</span><span>${CATS.map(x => `<i class="${c[x] ? "on" : ""}">${x}</i>`).join("")}</span><button id="toLog">기록 ›</button>`;
  $("#toLog").onclick = () => show("log");
}

/* ---------- 기록 탭 ---------- */
const PAPER = '<svg class="paper" viewBox="0 0 24 24"><path d="M4 3h16v15l-2 2-2-2-2 2-2-2-2 2-2-2-2 2-2-2z" fill="#fff" stroke="#6d665a" stroke-width="1.2"/><rect x="7" y="6" width="10" height="3" rx="1" fill="#1c1b19"/><path d="M7 12h10M7 15h6" stroke="#9a9384" stroke-width="1.5" stroke-linecap="round"/></svg>';
let cur = new Date(); cur.setDate(1);
function streak(st){ let n = 0, d = new Date(); if(!(st[key(d)] || {}).r) d.setDate(d.getDate() - 1); while((st[key(d)] || {}).r){ n++; d.setDate(d.getDate() - 1); } return n; }
function renderLog(){
  const st = getStats(), y = cur.getFullYear(), m = cur.getMonth(), today = key(new Date());
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let html = "일월화수목금토".split("").map(w => `<div class="wd">${w}</div>`).join(""), read = 0;
  for(let i = 0; i < first; i++) html += '<div class="cell empty"></div>';
  for(let d = 1; d <= days; d++){
    const k = key(new Date(y, m, d)), s = st[k] || {};
    if(s.r) read++;
    html += `<div class="cell${k === today ? " today" : ""}"><span class="dn">${d}</span>${s.r ? PAPER : ""}${s.v ? `<span class="vc">${s.v}회</span>` : ""}</div>`;
  }
  $("#cal").innerHTML = html; $("#mTitle").textContent = `${y}년 ${m + 1}월`;
  $("#sMonth").textContent = read; $("#sStreak").textContent = streak(st);
  $("#sRead").textContent = ((st[today] || {}).a || []).length; $("#sToday").textContent = (st[today] || {}).v || 0;
}
$("#prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderLog(); };
$("#next").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderLog(); };
function show(v){
  $("#viewNews").hidden = v !== "news"; $("#viewLog").hidden = v !== "log";
  $("#tabNews").classList.toggle("on", v === "news"); $("#tabLog").classList.toggle("on", v === "log");
  if(v === "log"){ renderLog(); renderPush(); }
  scrollTo(0, 0);
}
$("#tabNews").onclick = () => show("news"); $("#tabLog").onclick = () => show("log");

/* ---------- 홈: 뉴스 ---------- */
let D = null, A = {}, G = {}, shown = {};
const artLink = a => `<a class="al" data-id="${esc(a.id)}" data-cat="${esc(a.category)}" href="${esc(safe(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a>`;
const metaOf = (g, a) => `${esc(a.source)} · ${when(a.published_at)}${g.source_count > 1 ? ` · ${g.source_count}개 언론사` : ""}${g.status ? `<span class="tag">${esc(g.status)}</span>` : ""}`;
function related(g){
  const rest = g.article_ids.filter(i => i !== g.rep_id).map(i => A[i]).filter(Boolean).sort((x, y) => new Date(y.published_at) - new Date(x.published_at));
  return rest.length ? `<details><summary>관련 기사 ${rest.length}건 (언론사별 원문)</summary><ul class="rel">${rest.map(a => `<li>${artLink(a)} <span class="mt">${esc(a.source)} · ${when(a.published_at)}</span></li>`).join("")}</ul></details>` : "";
}
const box = (t, d) => `<div class="banner"><b>${t}</b><p>${d}</p></div>`;
function renderBanner(st){
  const bad = (st.feeds || []).filter(x => !x.ok);
  const list = bad.length ? `<details><summary>실패한 출처 ${bad.length}곳</summary><ul class="rel">${bad.map(x => `<li>${esc(x.name)} <span class="mt">${esc(x.error || "")}</span></li>`).join("")}</ul></details>` : "";
  const last = st.last_success_at ? `<br>마지막 수집 성공: ${when(st.last_success_at)}` : "";
  if(st.state === "pending") return box("아직 수집 전이에요", "GitHub Actions에서 update-briefing을 실행하면 실제 뉴스가 채워져요.");
  if(st.state === "failed") return box("뉴스 수집에 실패했어요", "샘플이나 가짜 기사로 대체하지 않아요. 잠시 후 새로고침해 주세요." + last + list);
  if(st.state === "empty") return box("수집된 기사가 없어요", "뉴스 피드는 응답했지만 최근 기사가 없어요." + list);
  if(st.state === "partial") return `<p class="note">일부 출처 ${bad.length}곳은 수집하지 못했어요.</p>${list}`;
  return "";
}
function renderTop(){
  const t = D.top || {items: []}, items = t.items.map(i => ({i, g: G[i.group_id]})).filter(x => x.g && A[x.g.rep_id]);
  if(!D.groups.length){ $("#lead").innerHTML = $("#top").innerHTML = ""; return; }
  if(!items.length){
    $("#lead").innerHTML = "";
    $("#top").innerHTML = `<div class="sh"><span>오늘의 TOP 5</span></div><p class="empty">여러 언론사 보도나 노출 같은 중요도 근거가 부족해 TOP 5를 만들지 않았어요. 아래 분야별 뉴스를 확인해 보세요.</p>`;
    return;
  }
  const f = items[0], fa = A[f.g.rep_id], ranked = t.mode === "ranked";
  $("#lead").innerHTML = `<div class="lead"><div class="kick">${ranked ? "오늘의 주요 이슈" : "주요 뉴스"}</div><h2>${artLink(fa)}</h2><div class="mt">${metaOf(f.g, fa)}</div></div>`;
  $("#top").innerHTML = `<div class="sh"><span>${ranked ? "오늘의 TOP 5" : "오늘의 주요 뉴스"}</span><span class="cnt">앱 자체 선정</span></div>
    <p class="note">${esc(t.note)}</p>
    <ol>${items.map(({i, g}) => { const a = A[g.rep_id]; return `<li class="ti"><span class="no">${ranked ? i.rank : "·"}</span><div>
      <h3>${artLink(a)}</h3><div class="mt">${metaOf(g, a)}</div>${g.summary ? `<p class="sm">${esc(g.summary)}</p>` : ""}
      <div class="why">${esc((i.reasons || []).join(" · "))}</div>${related(g)}</div></li>`; }).join("")}</ol>`;
}
function renderCats(){
  if(!D.groups.length){ $("#catWrap").innerHTML = ""; return; }
  const inTop = new Set((D.top.items || []).map(i => i.group_id)), by = D.by_category || {};
  const cats = CATS.concat((by["미분류"] || []).length ? ["미분류"] : []);
  $("#catWrap").innerHTML = `<div class="sh"><span>분야별 뉴스</span><span class="cnt">TOP 5 밖의 기사도 모두 볼 수 있어요</span></div>
    <nav class="chips" style="position:static;border:0;display:flex;padding:12px 0 2px">${cats.map((c, i) => `<a href="#sec-${i}">${label(c)}</a>`).join("")}</nav>` +
    cats.map((c, i) => {
      const ids = (by[c] || []).filter(id => G[id]), n = shown[c] || 3;
      const rows = ids.slice(0, n).map(id => { const g = G[id], a = A[g.rep_id]; if(!a) return "";
        return `<li><div class="rt">${artLink(a)}${inTop.has(id) ? '<span class="tag b">TOP</span>' : ""}</div><div class="mt">${metaOf(g, a)}</div>${related(g)}</li>`; }).join("");
      return `<section id="sec-${i}"><div class="sh"><span>${label(c)}</span><span class="cnt">${ids.length}건</span></div>
        ${rows ? `<ul class="lst">${rows}</ul>` : '<p class="empty">이 분야의 기사를 아직 찾지 못했어요.</p>'}
        ${ids.length > n ? `<button class="more" data-c="${esc(c)}">더 보기 (${ids.length - n})</button>` : ""}</section>`;
    }).join("");
}
function render(d){
  D = d; D.groups = d.groups || []; D.top = d.top || {items: []};
  A = Object.fromEntries((d.articles || []).map(a => [a.id, a])); G = Object.fromEntries(D.groups.map(g => [g.id, g]));
  const st = d.status || {state: "pending"};
  $("#banner").innerHTML = renderBanner(st);
  renderTop(); renderCats(); renderStrip();
}
async function load(){
  try{
    const r = await fetch("briefing.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    render(await r.json());
  }catch(e){
    $("#banner").innerHTML = box("브리핑 파일을 불러오지 못했어요", "네트워크 연결을 확인하거나 저장소에 briefing.json이 있는지 확인해 주세요.");
  }
}
$("#refresh").onclick = load;
setInterval(() => { if(!document.hidden) load(); }, 10 * 60 * 1000);

/* ---------- 웹푸시 설정 (키는 이 기기에서 만들고 밖으로 전송하지 않음) ---------- */
const b64u = {
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec: s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length / 4) * 4, "=")), c => c.charCodeAt(0))
};
async function ensureKeys(){
  let k = null; try { k = JSON.parse(store.get("vapid")); } catch(e) {}
  if(k) return k;
  const kp = await crypto.subtle.generateKey({name:"ECDSA", namedCurve:"P-256"}, true, ["sign"]);
  const j = await crypto.subtle.exportKey("jwk", kp.privateKey);
  k = {priv: j.d, pub: b64u.enc(new Uint8Array([4, ...b64u.dec(j.x), ...b64u.dec(j.y)]))};
  store.set("vapid", JSON.stringify(k));
  return k;
}
async function setupPush(){
  if(!("PushManager" in window)) throw new Error("이 브라우저는 푸시를 지원하지 않아요 (아이폰은 홈 화면에 설치 후 사용)");
  if(await Notification.requestPermission() !== "granted") throw new Error("알림 권한을 허용해야 해요");
  const reg = await navigator.serviceWorker.ready, k = await ensureKeys();
  let sub = await reg.pushManager.getSubscription();
  if(sub){ const ck = sub.options && sub.options.applicationServerKey; if(!ck || b64u.enc(ck) !== k.pub){ await sub.unsubscribe(); sub = null; } }
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u.dec(k.pub)});
  store.set("sub", JSON.stringify(sub.toJSON()));
}
function renderPush(){
  const on = !!store.get("sub") && !!store.get("vapid") && "Notification" in window && Notification.permission === "granted";
  $("#pushState").textContent = on ? "이 기기에서 구독됨 · 아래 값을 GitHub Secrets에 저장하면 푸시가 전송돼요." : "아직 꺼져 있어요. 켜면 알림 권한을 요청해요.";
  $("#pushCopy").hidden = !on; $("#pushOn").textContent = on ? "다시 구독" : "푸시 켜기";
}
async function copy(text){ try { await navigator.clipboard.writeText(text); alert("복사했어요"); } catch(e) { prompt("길게 눌러 복사하세요", text); } }
$("#pushOn").onclick = async () => { try { await setupPush(); } catch(e) { alert(e.message); } renderPush(); };
$("#cpSub").onclick = () => copy(store.get("sub") || "");
$("#cpKey").onclick = () => { try { copy(JSON.parse(store.get("vapid")).priv); } catch(e) {} };

/* ---------- 설치 ---------- */
let dp;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); dp = e; $("#install").hidden = false; });
$("#install").onclick = async () => { if(!dp) return; dp.prompt(); await dp.userChoice; dp = null; $("#install").hidden = true; };
window.addEventListener("appinstalled", () => { $("#install").hidden = true; });
if(/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone) $("#ios").hidden = false;
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
renderStrip(); load();
</script>
