name: update-briefing
on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각(UTC) 실행
  workflow_dispatch:       # 수동 실행 버튼
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 브리핑 생성
        run: python news_briefing.py --out briefing.json --format json > /dev/null
      - name: 변경 시 커밋
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add briefing.json
          git diff --cached --quiet || (git commit -m "update briefing" && git push)
